_format_version: "3.0"

services:
  - name: backend
    url: http://mihorario-production-944f.up.railway.app   # nombre y puerto reales de tu servicio
    routes:
      - name: api
        paths: ["/"]
        strip_path: false
        preserve_host: false   
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
      - name: request-size-limiting
        config:
          allowed_payload_size: 2        # MB
      - name: cors
        config:
          origins: ["https://frontend-production-8438.up.railway.app"]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, Content-Type]
          credentials: true